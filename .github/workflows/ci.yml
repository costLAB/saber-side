name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @saber-side/client exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: How to update the screenshots
        if: failure()
        run: |
          {
            echo "### If the picture changed on purpose"
            echo "Run **Actions → Update screenshots → Run workflow** with this branch (\`${{ github.head_ref || github.ref_name }}\`)."
            echo "It re-records the baselines on CI's machine, commits them here, and runs CI again."
            echo "Otherwise, the diffs are in the playwright-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/client/playwright-report
            apps/client/test-results
          retention-days: 7
